<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - iPOOR</title>
    <link rel="icon" type="image/png" href="../Image/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #0F172A;
            --primary-hover: #1E293B;
            --bg-light-blue: #F0F9FF;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border-color: #cbd5e1;
            --white: #ffffff;
            --secondary-blue: #3b82f6;
            --error-red: #DC2626;
            --success-green: #10B981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--white); }

        .auth-container {
            position: relative; width: 100%; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
        }

        .bg-decoration {
            position: absolute; top: 0; left: 0; width: 35%; height: 100%;
            background-color: var(--bg-light-blue); z-index: 0;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
        }

        .auth-card {
            position: relative; z-index: 1; background: var(--white);
            width: 100%; max-width: 480px; padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05),
                        0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .card-header { margin-bottom: 28px; }
        .logo-img { width: 48px; height: 48px; object-fit: contain; margin-bottom: 16px; }
        .card-title { font-size: 22px; font-weight: 600; color: var(--primary-navy); }
        .card-subtitle { font-size: 14px; color: var(--text-gray); margin-top: 8px; }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 13px; font-weight: 600;
            color: var(--text-dark); margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%; padding: 12px 16px; font-size: 14px;
            border: 1px solid var(--border-color); border-radius: 8px;
            transition: border-color 0.2s, box-shadow 0.2s; outline: none;
        }
        .form-group input:focus {
            border-color: var(--primary-navy);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
        }

        .btn-primary {
            width: 100%; padding: 12px; margin-top: 12px;
            background-color: var(--primary-navy);
            color: var(--white); border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-primary:disabled { background-color: var(--text-gray); cursor: not-allowed; }

        .card-footer {
            margin-top: 24px; text-align: center;
            border-top: 1px solid #f1f5f9; padding-top: 16px;
        }
        .card-footer a {
            color: var(--secondary-blue); text-decoration: none;
            font-weight: 500; cursor: pointer; font-size: 14px;
        }
        .card-footer a:hover { text-decoration: underline; }

        #status-msg {
            margin-top: 16px; padding: 12px; border-radius: 8px;
            font-size: 14px; display: none; line-height: 1.5;
        }
        #status-msg.error { background-color: #FEE2E2; color: var(--error-red); display: block; }
        #status-msg.success { background-color: #D1FAE5; color: var(--success-green); display: block; }

        @media (max-width: 600px) {
            .bg-decoration { display: none; }
            .auth-card { box-shadow: none; padding: 24px; }
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="bg-decoration"></div>

    <div class="auth-card">
        <div class="card-header">
            <img src="../Image/icon.png" alt="iPOOR" class="logo-img">
            <h2 class="card-title">Khôi phục mật khẩu</h2>
            <p class="card-subtitle">Vui lòng cung cấp chính xác thông tin đăng ký để đặt lại mật khẩu mới.</p>
        </div>

        <form id="forgot-form">
            <div class="form-group">
                <label for="email">Tài khoản (Email)</label>
                <input type="email" id="email" placeholder="Nhập email của bạn" required>
            </div>

            <div class="form-group">
                <label for="full_name">Họ và tên người dùng</label>
                <input type="text" id="full_name" placeholder="Nhập họ và tên như khi đăng ký" required>
            </div>

            <div class="form-group">
                <label for="cccd">Số CCCD / CMND</label>
                <input type="text" id="cccd" placeholder="Nhập số căn cước công dân" required>
            </div>

            <div class="form-group">
                <label for="new_password">Mật khẩu mới</label>
                <input type="password" id="new_password" placeholder="Nhập mật khẩu mới (ít nhất 8 ký tự)" required minlength="8">
            </div>

            <button type="submit" class="btn-primary" id="submit-btn">Đổi mật khẩu</button>
            <div id="status-msg"></div>
        </form>

        <div class="card-footer">
            <a href="Login.html">← Quay lại trang đăng nhập</a>
        </div>
    </div>
</div>

<script src="../config.js"></script>
<script>
    const API_BASE_URL = window.IPOOR_API_BASE;
    const form = document.getElementById('forgot-form');
    const statusEl = document.getElementById('status-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        statusEl.className = '';
        statusEl.textContent = 'Đang xử lý...';
        statusEl.style.display = 'block';
        submitBtn.disabled = true;

        const payload = {
            email: document.getElementById('email').value.trim(),
            full_name: document.getElementById('full_name').value.trim(),
            cccd: document.getElementById('cccd').value.trim(),
            new_password: document.getElementById('new_password').value
        };

        try {
            const res = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.status === 204) {
                statusEl.className = 'success';
                statusEl.textContent = 'Mật khẩu đã được cập nhật thành công! Đang chuyển hướng sang trang đăng nhập...';
                setTimeout(() => {
                    window.location.href = 'Login.html';
                }, 3000);
            } else {
                const data = await res.json();
                throw new Error(data.detail || 'Có lỗi xảy ra, vui lòng kiểm tra lại thông tin.');
            }
        } catch (error) {
            statusEl.className = 'error';
            statusEl.textContent = error.message;
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
