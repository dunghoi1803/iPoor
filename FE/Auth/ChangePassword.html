<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - iPOOR</title>
    <link rel="icon" type="image/png" href="../Image/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #0F172A;
            --primary-hover: #1E293B;
            --bg-light-blue: #F0F9FF;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border-color: #cbd5e1;
            --white: #ffffff;
            --secondary-blue: #3b82f6;
            --error-red: #DC2626;
            --success-green: #10B981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--white); }

        .auth-container {
            position: relative; width: 100%; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
        }

        .bg-decoration {
            position: absolute; top: 0; left: 0; width: 35%; height: 100%;
            background-color: var(--bg-light-blue); z-index: 0;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
        }

        .auth-card {
            position: relative; z-index: 1; background: var(--white);
            width: 100%; max-width: 420px; padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05),
                        0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .card-header { margin-bottom: 28px; }
        .logo-img { width: 48px; height: 48px; object-fit: contain; margin-bottom: 16px; }
        .card-title { font-size: 22px; font-weight: 600; color: var(--primary-navy); }
        .card-subtitle { font-size: 14px; color: var(--text-gray); margin-top: 8px; }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 14px; font-weight: 500;
            color: var(--text-dark); margin-bottom: 8px;
        }
        .form-group input {
            width: 100%; padding: 12px 16px; font-size: 14px;
            border: 1px solid var(--border-color); border-radius: 8px;
            transition: border-color 0.2s, box-shadow 0.2s; outline: none;
        }
        .form-group input:focus {
            border-color: var(--primary-navy);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
        }

        .btn-primary {
            width: 100%; padding: 12px; margin-top: 10px;
            background-color: var(--primary-navy);
            color: var(--white); border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-primary:disabled { background-color: var(--text-gray); cursor: not-allowed; }

        .card-footer {
            margin-top: 24px; text-align: center;
            border-top: 1px solid #f1f5f9; padding-top: 16px;
        }
        .card-footer a {
            color: var(--secondary-blue); text-decoration: none;
            font-weight: 500; cursor: pointer; font-size: 14px;
        }
        .card-footer a:hover { text-decoration: underline; }

        #status-msg {
            margin-top: 16px; font-size: 14px; display: none; line-height: 1.5;
            text-align: center;
        }
        #status-msg.error { color: var(--error-red); display: block; }
        #status-msg.success { color: var(--success-green); display: block; }

        @media (max-width: 600px) {
            .bg-decoration { display: none; }
            .auth-card { box-shadow: none; padding: 24px; }
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="bg-decoration"></div>

    <div class="auth-card">
        <div class="card-header">
            <img src="../Image/icon.png" alt="iPOOR" class="logo-img">
            <h2 class="card-title">Đổi mật khẩu</h2>
            <p class="card-subtitle">Nhập mật khẩu hiện tại và mật khẩu mới để thay đổi.</p>
        </div>

        <form id="change-password-form">
            <div class="form-group">
                <label for="old_password">Mật khẩu hiện tại</label>
                <input type="password" id="old_password" placeholder="Nhập mật khẩu đang dùng" required>
            </div>

            <div class="form-group">
                <label for="new_password">Mật khẩu mới</label>
                <input type="password" id="new_password" placeholder="Tối thiểu 8 ký tự" required minlength="8">
            </div>

            <div class="form-group">
                <label for="confirm_password">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirm_password" placeholder="Nhập lại mật khẩu mới" required minlength="8">
            </div>

            <button type="submit" class="btn-primary" id="submit-btn">Cập nhật mật khẩu</button>
            <div id="status-msg"></div>
        </form>

        <div class="card-footer">
            <a href="../HomePage/HomePage.html">← Quay lại Trang chủ</a>
        </div>
    </div>
</div>

<script src="../config.js"></script>
<script>
    const API_BASE_URL = window.IPOOR_API_BASE;
    const TOKEN_STORAGE_KEY = 'ipoor_access_token';
    const form = document.getElementById('change-password-form');
    const statusEl = document.getElementById('status-msg');
    const submitBtn = document.getElementById('submit-btn');

    function getToken() {
        return localStorage.getItem(TOKEN_STORAGE_KEY) || sessionStorage.getItem(TOKEN_STORAGE_KEY);
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const token = getToken();
        if (!token) {
            window.location.href = 'Login.html';
            return;
        }

        const old_password = document.getElementById('old_password').value;
        const new_password = document.getElementById('new_password').value;
        const confirm_password = document.getElementById('confirm_password').value;

        if (new_password !== confirm_password) {
            statusEl.className = 'error';
            statusEl.textContent = 'Mật khẩu xác nhận không khớp.';
            statusEl.style.display = 'block';
            return;
        }

        statusEl.className = '';
        statusEl.textContent = 'Đang cập nhật...';
        statusEl.style.display = 'block';
        submitBtn.disabled = true;

        try {
            const res = await fetch(`${API_BASE_URL}/auth/change-password`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ old_password, new_password })
            });

            if (res.ok) {
                statusEl.className = 'success';
                statusEl.textContent = 'Mật khẩu đã được thay đổi thành công!';
                form.reset();
            } else {
                const data = await res.json();
                throw new Error(data.detail || 'Có lỗi xảy ra, vui lòng kiểm tra lại mật khẩu cũ.');
            }
        } catch (error) {
            statusEl.className = 'error';
            statusEl.textContent = error.message;
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
