services:
  db:
    image: mysql:8.0
    container_name: ipoor_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-18032002}
      MYSQL_DATABASE: ${DB_NAME:-iPoor}
      TZ: UTC
    ports:
      - "3306:3306"
    command: [
      "mysqld",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci"
    ]
    volumes:
      - ipoor_db_data:/var/lib/mysql
    networks:
      - ipoor_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-18032002}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: ipoor_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/uploads:/app/uploads
      - ./FE/data:/app/FE/data
    networks:
      - ipoor_net

  fe:
    build: ./FE
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: ipoor_fe
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./FE:/usr/share/nginx/html
    networks:
      - ipoor_net

networks:
  ipoor_net:
    driver: bridge

volumes:
  ipoor_db_data:
    driver: local
